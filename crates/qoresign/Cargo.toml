[package]
name = "qorechain-qoresign"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["QoreChain Association"]
repository = "https://github.com/qorechain/qoresign"
homepage = "https://github.com/qorechain/qoresign"
documentation = "https://docs.rs/qorechain-qoresign"
description = "Hybrid secp256k1 + ML-DSA-87 (FIPS 204) signing, verification and Sign In With QoreChain."
readme = "README.md"
keywords = ["qorechain", "ml-dsa", "fips-204", "signing", "secp256k1"]
categories = ["cryptography", "authentication"]
# The vector tests read ../../vectors at run time, outside the crate.
exclude = ["tests/vectors.rs"]

[lib]
name = "qoresign"
path = "src/lib.rs"

[features]
default = ["std"]
# Reads the system clock when verify_siwq gets no explicit time.
std = []

[dependencies]
qorechain-pqc = "=0.2.3"
k256 = { version = "=0.13.4", default-features = false, features = ["ecdsa", "std"] }
bip32 = { version = "=0.5.3", default-features = false, features = ["secp256k1", "std"] }
bip39 = { version = "=2.2.2", default-features = false, features = ["std"] }
sha2 = "=0.10.9"
sha3 = "=0.10.8"
ripemd = "=0.1.3"
hmac = "=0.12.1"
bech32 = "=0.11.1"
base64 = "=0.22.1"
hex = "=0.4.3"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.18"

[dev-dependencies]
